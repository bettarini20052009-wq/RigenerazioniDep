```html
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro Rigenerazioni</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
padding:20px;
margin:0;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
text-align:center;
}

label{
font-weight:bold;
display:block;
margin-top:15px;
}

input, textarea{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

textarea{
min-height:80px;
resize:vertical;
}

.columns{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

button{
margin-top:15px;
padding:12px;
border:none;
border-radius:5px;
cursor:pointer;
font-weight:bold;
}

.save-btn{
background:#2e7d32;
color:white;
width:100%;
}

.export-btn{
background:#1565c0;
color:white;
width:100%;
}

.delete-btn{
background:#c62828;
color:white;
padding:8px;
margin-top:10px;
}

.record{
background:#fafafa;
border:1px solid #ddd;
padding:15px;
margin-top:15px;
border-radius:8px;
}

.signature{
border:1px dashed #999;
height:60px;
margin-top:10px;
padding:10px;
}

@media print{
button{
display:none;
}
}
</style>
</head>

<body>

<div class="container">

<div id="captureArea">

<h1>Registro Rigenerazioni</h1>

<label>Data</label>
<input type="date" id="data">

<label>Colonne rigenerate</label>

<div class="columns">
<label><input type="checkbox" value="Anionica1"> Anionica1</label>
<label><input type="checkbox" value="Anionica2"> Anionica2</label>
<label><input type="checkbox" value="Cationica1"> Cationica1</label>
<label><input type="checkbox" value="Cationica2"> Cationica2</label>
<label><input type="checkbox" value="Resina Selettiva 1"> Resina Selettiva 1</label>
<label><input type="checkbox" value="Resina Selettiva 2"> Resina Selettiva 2</label>
</div>

<label>Operatore esecutore</label>
<input type="text" id="operatore">

<label>Altri operatori</label>
<input type="text" id="altriOperatori">

<label>Note di rigenerazione</label>
<textarea id="note"></textarea>

<label>Firma</label>
<div class="signature" contenteditable="true" id="firma">
Scrivi qui la firma
</div>

</div>

<button class="save-btn" onclick="salvaRigenerazione()">
SALVA RIGENERAZIONE
</button>

<button class="export-btn" onclick="esportaImmagine()">
ESPORTA COME IMMAGINE
</button>

<h2>Storico Rigenerazioni</h2>

<div id="storico"></div>

</div>

<script>

let storico = JSON.parse(localStorage.getItem("storicoRigenerazioni")) || [];

function salvaRigenerazione(){

const data = document.getElementById("data").value;
const operatore = document.getElementById("operatore").value;
const altriOperatori = document.getElementById("altriOperatori").value;
const note = document.getElementById("note").value;
const firma = document.getElementById("firma").innerText;

const checkboxes = document.querySelectorAll("input[type=checkbox]:checked");

let colonne = [];

checkboxes.forEach(cb=>{
colonne.push(cb.value);
});

const record = {
data,
colonne,
operatore,
altriOperatori,
note,
firma
};

storico.unshift(record);

localStorage.setItem("storicoRigenerazioni", JSON.stringify(storico));

mostraStorico();

alert("Rigenerazione salvata");
}

function mostraStorico(){

const storicoDiv = document.getElementById("storico");

storicoDiv.innerHTML = "";

storico.forEach((r,index)=>{

storicoDiv.innerHTML += `

<div class="record">

<b>Data:</b> ${r.data}<br><br>

<b>Colonne:</b><br>
${r.colonne.join(", ")}<br><br>

<b>Operatore:</b><br>
${r.operatore}<br><br>

<b>Altri operatori:</b><br>
${r.altriOperatori}<br><br>

<b>Note:</b><br>
${r.note}<br><br>

<b>Firma:</b><br>
${r.firma}<br><br>

<button class="delete-btn" onclick="eliminaRecord(${index})">
ELIMINA
</button>

</div>

`;
});

}

function eliminaRecord(index){

if(confirm("Eliminare questa rigenerazione?")){

storico.splice(index,1);

localStorage.setItem("storicoRigenerazioni", JSON.stringify(storico));

mostraStorico();

}

}

function esportaImmagine(){

html2canvas(document.getElementById("captureArea")).then(canvas=>{

const link = document.createElement("a");

link.download = "rigenerazione.png";

link.href = canvas.toDataURL();

link.click();

});

}

mostraStorico();

</script>

</body>
</html>
```
